<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام البوب المطور - EL POP v5</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="main-container fade-in">
        <h1 id="currentWeekTitle" class="main-title">EL POP | إدارة الأرباح</h1>

        <div class="dashboard-grid">
            <div class="card sale-card">
                <h3>💰 تسجيل بيعة</h3>
                <select id="saleItemSelect"><option value="">اختر المنتج...</option></select>
                <input type="number" id="salePrice" placeholder="سعر القطعة الواحدة">
                <input type="number" id="saleQty" placeholder="العدد (كام قطعة؟)" value="1">
                <button onclick="makeSale()" class="btn-primary">إتمام البيع ✅</button>
            </div>

            <div class="card inventory-card">
                <h3>📦 المخزن</h3>
                <input type="text" id="itemName" placeholder="اسم القطعة">
                <input type="number" id="itemCost" placeholder="جملة">
                <input type="number" id="itemQty" placeholder="كمية">
                <button onclick="addToInventory()" class="btn-inventory">إضافة +</button>
            </div>

            <div class="card expense-card">
                <h3>💸 مصاريف</h3>
                <input type="text" id="expName" placeholder="صرفت في إيه؟">
                <input type="number" id="expPrice" placeholder="المبلغ">
                <button onclick="addExpense()" class="btn-danger">إضافة -</button>
            </div>
        </div>

        <div class="summary-bar">
            <div class="summary-item">مبيعات: <span id="totalSales">0</span></div>
            <div class="summary-item">مصاريف: <span id="totalExp">0</span></div>
            <div class="summary-item profit-highlight">صافي الربح: <span id="netProfit">0</span> ج.م</div>
        </div>

        <div class="actions" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button onclick="startNewWeek()" class="btn-new-week">🆕 فتح أسبوع جديد</button>
            <button onclick="finishDay()" style="background: #f39c12; color: white;">☀️ تقفيل اليوم وبدء يوم جديد</button>
            <button onclick="archiveWeek()" class="btn-archive" style="background: #2c3e50;">🔒 تقفيل الأسبوع نهائياً</button>
            <button onclick="exportToExcel()" class="btn-excel">📥 تحميل إكسيل</button>
        </div>

        <div class="week-section">
            <div class="week-title">📅 سجل العمليات (اضغط على الاسم أو السعر للتعديل ✏️)</div>
            <div id="daysLogContainer"></div>
        </div>

        <div class="week-section">
            <div class="week-title">📦 حالة المخزن (قابلة للتعديل مباشرة)</div>
            <table id="inventoryTable">
                <thead><tr><th>المنتج</th><th>الجملة</th><th>المتاح</th><th>تحكم</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="archiveSection" class="week-section">
            <div class="week-title" style="background: #64748b;">🗄️ الأرشيف (قابل للتعديل)</div>
            <div id="archiveContainer"></div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
